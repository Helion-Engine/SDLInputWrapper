name: build

permissions:
  contents: read
  packages: write

on: [workflow_dispatch, push]

jobs:
  build_native:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
            additionalconfig: sudo apt-get install -y cmake
            cmakeargs: -B build
            linkerfiles: SDL2_Native/build/*.a
            libfiles: SDL2_Native/build/libSDL2-2.0.so
          - os: windows-2022
            rid: win-x64
            additionalconfig: echo "Hi there."
            cmakeargs: -B build -A x64
            linkerfiles: SDL2_Native/build/Release/SDL2-static.lib
            libfiles: SDL2_Native/build/Release/SDL2.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Clone Submodules
        run: git submodule update --init
      - name: Install Tools
        run: ${{ matrix.additionalconfig }}
      - name: CMake Configure
        run: cmake ${{ matrix.cmakeargs }} -DSDL_AUDIO:BOOL="0" -DSDL_LOCALE:BOOL="0" -DSDL_HIDAPI_JOYSTICK:BOOL="1" -DSDL_MISC:BOOL="0" -DSDL_DUMMYAUDIO:BOOL="0" -DSDL_RENDER:BOOL="0" -DSDL_ALTIVEC:BOOL="0" -DSDL_CPUINFO:BOOL="0" -DSDL_SHARED:BOOL="1" -DSDL_OPENGL:BOOL="0" -DSDL_VULKAN:BOOL="0" -DSDL_DIRECTX:BOOL="0" -DSDL_RENDER_D3D:BOOL="0" -DSDL_FILE:BOOL="0" -DSDL_DUMMYVIDEO:BOOL="0" -DSDL_LOADSO:BOOL="0" -DSDL_OPENGLES:BOOL="0" -DSDL_TEST:BOOL="0" -DSDL_FILESYSTEM:BOOL="0" -DSDL_OFFSCREEN:BOOL="0" -DSDL_VIDEO:BOOL="0" -DSDL_DISKAUDIO:BOOL="0" -DSDL_POWER:BOOL="0" -DSDL_WASAPI:BOOL="0" -DSDL_ATOMIC:BOOL="0" -DSDL_UNIX_CONSOLE_BUILD=ON
        working-directory: SDL2_Native
      - name: CMake Build
        run: cmake --build . --config Release -j
        working-directory: SDL2_Native/build
      - name: Make Output Folder
        run: |
         mkdir -p build_native/${{ matrix.rid }}
         cp ${{ matrix.linkerfiles }} build_native/${{ matrix.rid }}
         cp ${{ matrix.libfiles }} build_native/${{ matrix.rid }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: build_native
